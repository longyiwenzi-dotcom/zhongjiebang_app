services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zhongjiebang_demo
      MYSQL_USER: zhongjiebang_demo
      MYSQL_PASSWORD: demo-local-only
      MYSQL_ROOT_PASSWORD: root-local-only
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - demo_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  demo_mysql:
