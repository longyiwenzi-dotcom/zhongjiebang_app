services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root-local-only
      MYSQL_DATABASE: zhongjiebang_cloud
      TZ: Asia/Shanghai
    ports: [ "127.0.0.1:3307:3306" ]
    volumes:
      - cloud_mysql:/var/lib/mysql
      - ./infra/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot-local-only" ]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    ports: [ "127.0.0.1:6379:6379" ]
    volumes: [ "cloud_redis:/data" ]
  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports: [ "127.0.0.1:8848:8848", "127.0.0.1:9848:9848" ]
  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    ports: [ "127.0.0.1:8858:8858" ]
  zipkin:
    image: openzipkin/zipkin:3.4
    ports: [ "127.0.0.1:9411:9411" ]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: demo-local
      RABBITMQ_DEFAULT_PASS: demo-local-only
    ports: [ "127.0.0.1:5672:5672", "127.0.0.1:15672:15672" ]
  seata:
    image: apache/seata-server:2.2.0
    profiles: [ "seata" ]
    environment:
      STORE_MODE: file
      SEATA_IP: seata
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports: [ "127.0.0.1:7091:7091", "127.0.0.1:8091:8091" ]
  user-app:
    profiles: [ "apps" ]
    build:
      context: .
      args: { JAR_FILE: "user-app/target/user-app-1.0.0-SNAPSHOT.jar" }
    environment: &app-environment
      NACOS_ADDR: nacos:8848
      REDIS_HOST: redis
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root-local-only
      SENTINEL_DASHBOARD: sentinel:8858
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: demo-local
      RABBITMQ_PASSWORD: demo-local-only
      SEATA_ENABLED: ${SEATA_ENABLED:-false}
      SEATA_ADDR: seata:8091
    depends_on: [ mysql, redis, rabbitmq, nacos, zipkin ]
  membership-app:
    profiles: [ "apps" ]
    build:
      context: .
      args: { JAR_FILE: "membership-app/target/membership-app-1.0.0-SNAPSHOT.jar" }
    environment: *app-environment
    depends_on: [ mysql, redeem-app, nacos, sentinel, zipkin ]
  house-app:
    profiles: [ "apps" ]
    build:
      context: .
      args: { JAR_FILE: "house-app/target/house-app-1.0.0-SNAPSHOT.jar" }
    environment: *app-environment
    depends_on: [ membership-app, rabbitmq, nacos, sentinel, zipkin ]
  gateway:
    profiles: [ "apps" ]
    build:
      context: .
      args: { JAR_FILE: "gateway/target/gateway-1.0.0-SNAPSHOT.jar" }
    environment: *app-environment
    depends_on: [ user-app, house-app, membership-app, audit-app, redis, nacos, sentinel, zipkin ]
    ports: [ "127.0.0.1:9000:9000" ]
  audit-app:
    profiles: [ "apps" ]
    build:
      context: .
      args: { JAR_FILE: "audit-app/target/audit-app-1.0.0-SNAPSHOT.jar" }
    environment: *app-environment
    depends_on: [ mysql, rabbitmq, nacos, zipkin ]
  redeem-app:
    profiles: [ "apps" ]
    build:
      context: .
      args: { JAR_FILE: "redeem-app/target/redeem-app-1.0.0-SNAPSHOT.jar" }
    environment: *app-environment
    depends_on: [ mysql, nacos ]
volumes:
  cloud_mysql:
  cloud_redis:
