services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root-local-only
      MYSQL_DATABASE: zhongjiebang_cloud
      TZ: Asia/Shanghai
    ports: [ "3307:3306" ]
    volumes:
      - cloud_mysql:/var/lib/mysql
      - ./infra/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot-local-only" ]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    ports: [ "6379:6379" ]
    volumes: [ "cloud_redis:/data" ]
  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports: [ "8848:8848", "9848:9848" ]
  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    ports: [ "8858:8858" ]
  seata:
    image: apache/seata-server:2.2.0
    profiles: [ "seata" ]
    environment:
      STORE_MODE: file
      SEATA_IP: host.docker.internal
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports: [ "7091:7091", "8091:8091" ]
volumes:
  cloud_mysql:
  cloud_redis:
