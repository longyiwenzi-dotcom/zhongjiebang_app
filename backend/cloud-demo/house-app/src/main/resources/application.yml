server.port: 9102
spring:
  config.import: optional:nacos:zjb-house.yml
  application.name: zjb-house
  cloud:
    nacos.discovery.server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    sentinel.transport.dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
feign.sentinel.enabled: true
spring.datasource:
  url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/zhongjiebang_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  username: ${MYSQL_USER:root}
  password: ${MYSQL_PASSWORD:root-local-only}
spring.rabbitmq:
  host: ${RABBITMQ_HOST:127.0.0.1}
  port: ${RABBITMQ_PORT:5672}
  username: ${RABBITMQ_USER:guest}
  password: ${RABBITMQ_PASSWORD:guest}
management.endpoints.web.exposure.include: health,info
management:
  tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin.tracing.endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}
